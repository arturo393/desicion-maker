name: CI

# Sin filtro de ramas a proposito: el filtro era [master], la rama se renombro a main
# el 2026-09-28 y desde entonces ningun push corrio CI, sin aviso. Un filtro por nombre
# se rompe en el proximo rename; uno vacio no.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff + dev-agents linter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            rust_core/target
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_core/Cargo.lock') }}

      # --frozen falla si uv.lock no corresponde a pyproject.toml, que es
      # justamente lo que se quiere: el drift tiene que romper el build, no
      # resolverse en silencio. maturin es el build-backend declarado, asi que
      # uv sync compila la extension Rust sin pasos extra.
      - name: Install from the frozen lock (builds Rust extension via maturin)
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run dev-agents linter
        run: uv run python scripts/dev_agents_linter.py src/decision_maker/core

      - name: "Docs: every link resolves"
        run: uv run python scripts/check_docs_links.py

      - name: "Docs: vault root is docs/ and holds no generated content"
        run: uv run python scripts/check_docs_scope.py

      - name: "Docs: notes match the source they describe"
        run: uv run python scripts/check_obsidian_fidelity.py

      - name: "Docs: no cross-language drift in the vault"
        run: uv run python scripts/check_obsidian_language.py

      - name: Run tests
        run: uv run pytest --tb=short -q

      - name: Coverage gate (core >= 80%)
        run: |
          uv run coverage run --source=src/decision_maker/core -m pytest --tb=short -q
          uv run coverage report --fail-under=80

  build-wheel:
    name: Build wheel (maturin sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.4,<2.0"

      - name: Build wheel
        run: maturin build --release --manifest-path rust_core/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: decision-maker-wheel
          path: target/wheels/*.whl
