name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: pytest + ruff + dev-agents linter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            rust_core/target
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_core/Cargo.lock') }}

      - name: Install package (builds Rust extension via maturin)
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.4,<2.0"
          pip install -e ".[test]"

      - name: Lint with ruff
        run: ruff check src/decision_maker

      - name: Run dev-agents linter
        run: python scripts/dev_agents_linter.py src/decision_maker/core

      - name: Run tests
        run: pytest --tb=short -q

      - name: Coverage gate (core >= 80%)
        run: |
          coverage run --source=src/decision_maker/core -m pytest --tb=short -q
          coverage report --fail-under=80

  build-wheel:
    name: Build wheel (maturin sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.4,<2.0"

      - name: Build wheel
        run: maturin build --release --manifest-path rust_core/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: decision-maker-wheel
          path: target/wheels/*.whl
