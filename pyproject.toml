[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "decision-maker"
version = "3.0.0"
description = "Multi-Criteria Decision Intelligence Framework with Monte Carlo simulation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Arturo"},
]
keywords = ["decision-making", "monte-carlo", "topsis", "promethee", "ahp", "mcdm", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.33.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dashboard = [
    "streamlit>=1.25.0",
    "plotly>=5.15.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
decision-maker = "decision_maker.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "decision_maker_core"
python-source = "src"
manifest-path = "rust_core/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["src/decision_maker/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT"]
ignore = ["E501", "E402", "F401", "F403"]

[tool.coverage.run]
source = ["src/decision_maker"]
omit = ["src/decision_maker/tests/*"]
