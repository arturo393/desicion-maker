[package]
name = "decision_maker_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "decision_maker_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }
rayon = "1.8"
rand = "0.8"
ndarray = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_distr = "0.4"
